# KD P0: Does 9B LoRA -> 2B distillation help?
# Two parallel training runs (baseline vs KD), then bench both on formatting + olmOCR.
# Requires: outputs/fmt_lora_qwen35-9b (teacher checkpoint)
#
# Note: Skips OCR SFT stage. OCR LoRA kills formatting in 9B (31.4% -> 0.7% F1),
# so we train formatting directly from pretrained to preserve base capability.
#
# Usage:
#   scripts/slurm/run_chain.sh chains/kd_fmt_2b_p0.yaml

steps:
  # -----------------------------------------------------------------------
  # Training (parallel - no dependencies between them)
  # -----------------------------------------------------------------------
  - name: Baseline SFT (no teacher)
    run_name: fmt_lora_qwen35-2b
    config: configs/ocr/formatting/qwen35-2b/00_sft.yaml

  - name: Response KL (9B LoRA teacher)
    run_name: kd_fmt_2b_response-kl
    config: configs/ocr/formatting/qwen35-2b/kd/qwen35-9b/01_response-kl.yaml
    env:
      TEACHER_ADAPTER: outputs/fmt_lora_qwen35-9b

  # -----------------------------------------------------------------------
  # Formatting bench
  # -----------------------------------------------------------------------
  - name: Baseline - Formatting bench
    run_name: fmt_lora_qwen35-2b_bench-formatting
    type: bench
    depends_on: fmt_lora_qwen35-2b
    config: formatting
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-2b
      OUTPUT: outputs/bench/formatting/fmt_lora_qwen35-2b

  - name: KD - Formatting bench
    run_name: kd_fmt_2b_response-kl_bench-formatting
    type: bench
    depends_on: kd_fmt_2b_response-kl
    config: formatting
    env:
      CHECKPOINT: outputs/kd_fmt_2b_response-kl
      OUTPUT: outputs/bench/formatting/kd_fmt_2b_response-kl

  # -----------------------------------------------------------------------
  # olmOCR bench (3 shards each)
  # -----------------------------------------------------------------------

  # Baseline
  - name: Baseline - olmOCR shard 1/3
    run_name: fmt_lora_qwen35-2b_bench-olmocr_s0
    type: bench
    depends_on: fmt_lora_qwen35-2b_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-2b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-2b
      SHARD: 1/3

  - name: Baseline - olmOCR shard 2/3
    run_name: fmt_lora_qwen35-2b_bench-olmocr_s1
    type: bench
    depends_on: fmt_lora_qwen35-2b_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-2b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-2b
      SHARD: 2/3

  - name: Baseline - olmOCR shard 3/3
    run_name: fmt_lora_qwen35-2b_bench-olmocr_s2
    type: bench
    depends_on: fmt_lora_qwen35-2b_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-2b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-2b
      SHARD: 3/3

  - name: Baseline - olmOCR score
    run_name: fmt_lora_qwen35-2b_bench-olmocr_score
    type: score
    depends_on:
      - fmt_lora_qwen35-2b_bench-olmocr_s0
      - fmt_lora_qwen35-2b_bench-olmocr_s1
      - fmt_lora_qwen35-2b_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-2b

  # KD
  - name: KD - olmOCR shard 1/3
    run_name: kd_fmt_2b_response-kl_bench-olmocr_s0
    type: bench
    depends_on: kd_fmt_2b_response-kl_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/kd_fmt_2b_response-kl
      OUTPUT: outputs/bench/olmocr/kd_fmt_2b_response-kl
      SHARD: 1/3

  - name: KD - olmOCR shard 2/3
    run_name: kd_fmt_2b_response-kl_bench-olmocr_s1
    type: bench
    depends_on: kd_fmt_2b_response-kl_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/kd_fmt_2b_response-kl
      OUTPUT: outputs/bench/olmocr/kd_fmt_2b_response-kl
      SHARD: 2/3

  - name: KD - olmOCR shard 3/3
    run_name: kd_fmt_2b_response-kl_bench-olmocr_s2
    type: bench
    depends_on: kd_fmt_2b_response-kl_bench-formatting
    config: olmocr
    env:
      CHECKPOINT: outputs/kd_fmt_2b_response-kl
      OUTPUT: outputs/bench/olmocr/kd_fmt_2b_response-kl
      SHARD: 3/3

  - name: KD - olmOCR score
    run_name: kd_fmt_2b_response-kl_bench-olmocr_score
    type: score
    depends_on:
      - kd_fmt_2b_response-kl_bench-olmocr_s0
      - kd_fmt_2b_response-kl_bench-olmocr_s1
      - kd_fmt_2b_response-kl_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/kd_fmt_2b_response-kl
