# Qwen3.5-27B teacher pipeline
# Train: OCR grounding -> Formatting SFT
# Bench: Sequential groups - formatting, omnidoc, olmocr. Each group
# completes before the next starts. Shards within a group run in parallel.
#
# Usage:
#   scripts/slurm/run_chain.sh chains/qwen35-27b_ocr_pipeline.yaml

steps:
  # -----------------------------------------------------------------------
  # Training
  # -----------------------------------------------------------------------
  - name: OCR Grounding
    run_name: ocr_lora_qwen35-27b
    config: configs/ocr/olmocr-mix/qwen35-27b/00_sft.yaml

  - name: Formatting SFT
    run_name: fmt_lora_qwen35-27b
    depends_on: ocr_lora_qwen35-27b
    config: configs/ocr/formatting/qwen35-27b/00_sft.yaml
    env:
      ADAPTER: outputs/ocr_lora_qwen35-27b

  # -----------------------------------------------------------------------
  # Formatting bench (3-4 depend on training)
  # -----------------------------------------------------------------------
  - name: FMT - Formatting bench
    run_name: fmt_lora_qwen35-27b_bench-formatting
    type: bench
    depends_on: fmt_lora_qwen35-27b
    config: formatting
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/formatting/fmt_lora_qwen35-27b

  - name: OCR - Formatting bench
    run_name: ocr_lora_qwen35-27b_bench-formatting
    type: bench
    depends_on: ocr_lora_qwen35-27b
    config: formatting
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/formatting/ocr_lora_qwen35-27b

  # -----------------------------------------------------------------------
  # OmniDoc bench (5-7 depend on 3-4, 8-10 depend on 5-7)
  # -----------------------------------------------------------------------
  - name: FMT - OmniDoc shard 1/3
    run_name: fmt_lora_qwen35-27b_bench-omnidoc_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-formatting
      - ocr_lora_qwen35-27b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-27b
      SHARD: 1/3

  - name: FMT - OmniDoc shard 2/3
    run_name: fmt_lora_qwen35-27b_bench-omnidoc_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-formatting
      - ocr_lora_qwen35-27b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-27b
      SHARD: 2/3

  - name: FMT - OmniDoc shard 3/3
    run_name: fmt_lora_qwen35-27b_bench-omnidoc_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-formatting
      - ocr_lora_qwen35-27b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-27b
      SHARD: 3/3

  - name: OCR - OmniDoc shard 1/3
    run_name: ocr_lora_qwen35-27b_bench-omnidoc_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_s0
      - fmt_lora_qwen35-27b_bench-omnidoc_s1
      - fmt_lora_qwen35-27b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-27b
      SHARD: 1/3

  - name: OCR - OmniDoc shard 2/3
    run_name: ocr_lora_qwen35-27b_bench-omnidoc_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_s0
      - fmt_lora_qwen35-27b_bench-omnidoc_s1
      - fmt_lora_qwen35-27b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-27b
      SHARD: 2/3

  - name: OCR - OmniDoc shard 3/3
    run_name: ocr_lora_qwen35-27b_bench-omnidoc_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_s0
      - fmt_lora_qwen35-27b_bench-omnidoc_s1
      - fmt_lora_qwen35-27b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-27b
      SHARD: 3/3

  - name: FMT - OmniDoc score
    run_name: fmt_lora_qwen35-27b_bench-omnidoc_score
    type: score
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_s0
      - fmt_lora_qwen35-27b_bench-omnidoc_s1
      - fmt_lora_qwen35-27b_bench-omnidoc_s2
    config: omnidoc
    env:
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-27b

  - name: OCR - OmniDoc score
    run_name: ocr_lora_qwen35-27b_bench-omnidoc_score
    type: score
    depends_on:
      - ocr_lora_qwen35-27b_bench-omnidoc_s0
      - ocr_lora_qwen35-27b_bench-omnidoc_s1
      - ocr_lora_qwen35-27b_bench-omnidoc_s2
    config: omnidoc
    env:
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-27b

  # -----------------------------------------------------------------------
  # olmOCR bench (13-15 depend on 11-12, 16-18 depend on 13-15)
  # -----------------------------------------------------------------------
  - name: FMT - olmOCR shard 1/3
    run_name: fmt_lora_qwen35-27b_bench-olmocr_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_score
      - ocr_lora_qwen35-27b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-27b
      SHARD: 1/3

  - name: FMT - olmOCR shard 2/3
    run_name: fmt_lora_qwen35-27b_bench-olmocr_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_score
      - ocr_lora_qwen35-27b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-27b
      SHARD: 2/3

  - name: FMT - olmOCR shard 3/3
    run_name: fmt_lora_qwen35-27b_bench-olmocr_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-omnidoc_score
      - ocr_lora_qwen35-27b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-27b
      SHARD: 3/3

  - name: OCR - olmOCR shard 1/3
    run_name: ocr_lora_qwen35-27b_bench-olmocr_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-olmocr_s0
      - fmt_lora_qwen35-27b_bench-olmocr_s1
      - fmt_lora_qwen35-27b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-27b
      SHARD: 1/3

  - name: OCR - olmOCR shard 2/3
    run_name: ocr_lora_qwen35-27b_bench-olmocr_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-olmocr_s0
      - fmt_lora_qwen35-27b_bench-olmocr_s1
      - fmt_lora_qwen35-27b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-27b
      SHARD: 2/3

  - name: OCR - olmOCR shard 3/3
    run_name: ocr_lora_qwen35-27b_bench-olmocr_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-27b_bench-olmocr_s0
      - fmt_lora_qwen35-27b_bench-olmocr_s1
      - fmt_lora_qwen35-27b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-27b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-27b
      SHARD: 3/3

  - name: FMT - olmOCR score
    run_name: fmt_lora_qwen35-27b_bench-olmocr_score
    type: score
    depends_on:
      - fmt_lora_qwen35-27b_bench-olmocr_s0
      - fmt_lora_qwen35-27b_bench-olmocr_s1
      - fmt_lora_qwen35-27b_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-27b

  - name: OCR - olmOCR score
    run_name: ocr_lora_qwen35-27b_bench-olmocr_score
    type: score
    depends_on:
      - ocr_lora_qwen35-27b_bench-olmocr_s0
      - ocr_lora_qwen35-27b_bench-olmocr_s1
      - ocr_lora_qwen35-27b_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-27b
