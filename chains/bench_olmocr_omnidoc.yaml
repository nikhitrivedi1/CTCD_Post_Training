  # Qwen3.5-2B
  # -----------------------------------------------------------------------
  - name: OCR Q35-2B - olmOCR bench
    run_name: ocr_sft-lora_qwen35-2b_bench-olmocr
    type: bench
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_sft-lora_qwen35-2b
      OUTPUT: outputs/bench/olmocr/ocr_sft-lora_qwen35-2b

  - name: FMT Q35-2B - olmOCR bench
