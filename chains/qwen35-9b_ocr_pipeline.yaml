# Qwen3.5-9B pipeline
# Train: OCR grounding -> Formatting SFT
# Bench: Sequential groups - formatting, omnidoc, olmocr
#
# Usage:
#   scripts/slurm/run_chain.sh chains/qwen35-9b_ocr_pipeline.yaml

steps:
  # -----------------------------------------------------------------------
  # Training
  # -----------------------------------------------------------------------
  - name: OCR grounding
    run_name: ocr_lora_qwen35-9b
    config: configs/ocr/olmocr-mix/qwen35-9b/00_sft.yaml

  - name: Formatting SFT
    run_name: fmt_lora_qwen35-9b
    depends_on: ocr_lora_qwen35-9b
    config: configs/ocr/formatting/qwen35-9b/00_sft.yaml
    env:
      ADAPTER: outputs/ocr_lora_qwen35-9b

  # -----------------------------------------------------------------------
  # Formatting bench
  # -----------------------------------------------------------------------
  - name: FMT - Formatting bench
    run_name: fmt_lora_qwen35-9b_bench-formatting
    type: bench
    depends_on: fmt_lora_qwen35-9b
    config: formatting
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/formatting/fmt_lora_qwen35-9b

  - name: OCR - Formatting bench
    run_name: ocr_lora_qwen35-9b_bench-formatting
    type: bench
    depends_on: fmt_lora_qwen35-9b
    config: formatting
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/formatting/ocr_lora_qwen35-9b

  # -----------------------------------------------------------------------
  # OmniDoc bench
  # -----------------------------------------------------------------------
  - name: FMT - OmniDoc shard 1/3
    run_name: fmt_lora_qwen35-9b_bench-omnidoc_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-formatting
      - ocr_lora_qwen35-9b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-9b
      SHARD: 1/3

  - name: FMT - OmniDoc shard 2/3
    run_name: fmt_lora_qwen35-9b_bench-omnidoc_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-formatting
      - ocr_lora_qwen35-9b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-9b
      SHARD: 2/3

  - name: FMT - OmniDoc shard 3/3
    run_name: fmt_lora_qwen35-9b_bench-omnidoc_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-formatting
      - ocr_lora_qwen35-9b_bench-formatting
    config: omnidoc
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-9b
      SHARD: 3/3

  - name: OCR - OmniDoc shard 1/3
    run_name: ocr_lora_qwen35-9b_bench-omnidoc_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_s0
      - fmt_lora_qwen35-9b_bench-omnidoc_s1
      - fmt_lora_qwen35-9b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-9b
      SHARD: 1/3

  - name: OCR - OmniDoc shard 2/3
    run_name: ocr_lora_qwen35-9b_bench-omnidoc_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_s0
      - fmt_lora_qwen35-9b_bench-omnidoc_s1
      - fmt_lora_qwen35-9b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-9b
      SHARD: 2/3

  - name: OCR - OmniDoc shard 3/3
    run_name: ocr_lora_qwen35-9b_bench-omnidoc_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_s0
      - fmt_lora_qwen35-9b_bench-omnidoc_s1
      - fmt_lora_qwen35-9b_bench-omnidoc_s2
    config: omnidoc
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-9b
      SHARD: 3/3

  - name: FMT - OmniDoc score
    run_name: fmt_lora_qwen35-9b_bench-omnidoc_score
    type: score
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_s0
      - fmt_lora_qwen35-9b_bench-omnidoc_s1
      - fmt_lora_qwen35-9b_bench-omnidoc_s2
    config: omnidoc
    env:
      OUTPUT: outputs/bench/omnidoc/fmt_lora_qwen35-9b

  - name: OCR - OmniDoc score
    run_name: ocr_lora_qwen35-9b_bench-omnidoc_score
    type: score
    depends_on:
      - ocr_lora_qwen35-9b_bench-omnidoc_s0
      - ocr_lora_qwen35-9b_bench-omnidoc_s1
      - ocr_lora_qwen35-9b_bench-omnidoc_s2
    config: omnidoc
    env:
      OUTPUT: outputs/bench/omnidoc/ocr_lora_qwen35-9b

  # -----------------------------------------------------------------------
  # olmOCR bench
  # -----------------------------------------------------------------------
  - name: FMT - olmOCR shard 1/3
    run_name: fmt_lora_qwen35-9b_bench-olmocr_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_score
      - ocr_lora_qwen35-9b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-9b
      SHARD: 1/3

  - name: FMT - olmOCR shard 2/3
    run_name: fmt_lora_qwen35-9b_bench-olmocr_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_score
      - ocr_lora_qwen35-9b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-9b
      SHARD: 2/3

  - name: FMT - olmOCR shard 3/3
    run_name: fmt_lora_qwen35-9b_bench-olmocr_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-omnidoc_score
      - ocr_lora_qwen35-9b_bench-omnidoc_score
    config: olmocr
    env:
      CHECKPOINT: outputs/fmt_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-9b
      SHARD: 3/3

  - name: OCR - olmOCR shard 1/3
    run_name: ocr_lora_qwen35-9b_bench-olmocr_s0
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-olmocr_s0
      - fmt_lora_qwen35-9b_bench-olmocr_s1
      - fmt_lora_qwen35-9b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-9b
      SHARD: 1/3

  - name: OCR - olmOCR shard 2/3
    run_name: ocr_lora_qwen35-9b_bench-olmocr_s1
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-olmocr_s0
      - fmt_lora_qwen35-9b_bench-olmocr_s1
      - fmt_lora_qwen35-9b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-9b
      SHARD: 2/3

  - name: OCR - olmOCR shard 3/3
    run_name: ocr_lora_qwen35-9b_bench-olmocr_s2
    type: bench
    depends_on:
      - fmt_lora_qwen35-9b_bench-olmocr_s0
      - fmt_lora_qwen35-9b_bench-olmocr_s1
      - fmt_lora_qwen35-9b_bench-olmocr_s2
    config: olmocr
    env:
      CHECKPOINT: outputs/ocr_lora_qwen35-9b
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-9b
      SHARD: 3/3

  - name: FMT - olmOCR score
    run_name: fmt_lora_qwen35-9b_bench-olmocr_score
    type: score
    depends_on:
      - fmt_lora_qwen35-9b_bench-olmocr_s0
      - fmt_lora_qwen35-9b_bench-olmocr_s1
      - fmt_lora_qwen35-9b_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/fmt_lora_qwen35-9b

  - name: OCR - olmOCR score
    run_name: ocr_lora_qwen35-9b_bench-olmocr_score
    type: score
    depends_on:
      - ocr_lora_qwen35-9b_bench-olmocr_s0
      - ocr_lora_qwen35-9b_bench-olmocr_s1
      - ocr_lora_qwen35-9b_bench-olmocr_s2
    config: olmocr
    env:
      OUTPUT: outputs/bench/olmocr/ocr_lora_qwen35-9b
