[project]
name = "forge"
version = "1.0.0"
description = "Config-driven framework for fine-tuning, knowledge distillation, and reinforcement learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Forge Team" }
]
keywords = [
    "fine-tuning",
    "knowledge-distillation",
    "reinforcement-learning",
    "model-compression",
    "transformers",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # PyTorch (pip auto-selects CUDA on Linux, MPS on Mac)
    # Requires >=2.6 due to CVE-2025-32434 (torch.load vulnerability)
    "torch>=2.6",
    "torchvision>=0.21",
    "torchaudio>=2.6",
    "transformers>=5.2.0",
    "datasets>=2.14.0",
    "evaluate>=0.4.0",
    "sacrebleu>=2.3.0",
    "wandb>=0.16.0",
    "trl>=0.29.0",
    "peft>=0.18.0",
    "accelerate>=0.25.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    # Nixon et al. ACE via https://github.com/Jonathan-Pearce/calibration-toolbox (not on PyPI as of 2026)
    "calibration-toolbox @ git+https://github.com/Jonathan-Pearce/calibration-toolbox.git@4048634ffb32d1e24b7bb859bd1be5cf59d7cc3f",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",

    # OCR / Vision-Language Model support
    "olmocr>=0.4.0",
    "qwen-vl-utils>=0.0.8",
    "Pillow>=10.0.0",
    "compressed-tensors>=0.8.0",

    # Bench scoring dependencies
    "fuzzysearch>=0.7.0",
    "rapidfuzz>=3.0.0",
    "sequence-align>=0.1.0",
    "pypdfium2>=4.0.0",
    "syntok>=1.4.0",
    "playwright>=1.40.0",
    "apted>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/NU-Deep-Learning/Forge"
Documentation = "https://github.com/NU-Deep-Learning/Forge/blob/main/README.md"
Repository = "https://github.com/NU-Deep-Learning/Forge"
Issues = "https://github.com/NU-Deep-Learning/Forge/issues"

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Override stale upper bounds from olmocr (pins transformers==4.57.3, huggingface-hub<1)
# Safe: we only use olmocr's bench/rendering utilities, not its model inference
override-dependencies = [
    "transformers>=5.2.0",
    "huggingface-hub>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src --cov-report=term-missing"
pythonpath = ["."]
markers = [
    "gpu: requires accelerator (CUDA or MPS)",
    "slow: takes > 30s",
]
