name: distillation
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - git               # Conda's git uses conda's OpenSSL (avoids system lib conflicts on HPC)
  - git-lfs           # Git Large File Storage (HF dataset downloads)
  - openssl           # Explicit so conda resolves git+openssl compatibility together
  - poppler           # PDF rendering (used by olmocr for data prep)
  - pip

  # Install all packages via pip
  - pip:
      # PyTorch (pip auto-selects CUDA on Linux, MPS on Mac)
      # Requires >=2.6 due to CVE-2025-32434 (torch.load vulnerability)
      - torch>=2.6
      - torchvision
      - torchaudio
      - transformers>=4.35.0
      - datasets>=2.14.0
      - evaluate>=0.4.0
      - sacrebleu>=2.3.0
      - unbabel-comet>=2.2.0
      - wandb>=0.16.0
      - peft>=0.18.0
      - accelerate>=0.25.0
      - pyyaml>=6.0
      - scikit-learn>=1.3.0
      - numpy>=1.24.0
      - tqdm>=4.66.0
      - python-dotenv>=1.0.0

      # OCR / Vision-Language Model support
      - olmocr>=0.4.0
      - qwen-vl-utils>=0.0.8
      - Pillow>=10.0.0
      - compressed-tensors>=0.8.0  # Required for FP8 quantized models (e.g. olmOCR-2-7B-1025-FP8)

      # olmOCR-Bench scoring dependencies
      - fuzzysearch>=0.7.0
      - rapidfuzz>=3.0.0
      - sequence-align>=0.1.0
      - pypdfium2>=4.0.0
      - syntok>=1.4.0
      - playwright>=1.40.0     # KaTeX math rendering for bench scoring

      # GPU optimization (CUDA-only, install separately via scripts/env/init.sh):
      #   pip install flash-attn --no-build-isolation

      # Development tools (optional)
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - black>=23.0.0
      - ruff>=0.1.0
      - mypy>=1.7.0
      - pre-commit>=3.5.0
