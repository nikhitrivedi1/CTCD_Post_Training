name: distillation
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # PyTorch (automatically uses MPS on M2 Macs, CUDA on Linux/Windows)
  # Requires >=2.6 due to CVE-2025-32434 (torch.load vulnerability)
  - pytorch>=2.6
  - torchvision
  - torchaudio

  # Install remaining packages via pip
  - pip:
      - transformers>=4.35.0
      - datasets>=2.14.0
      - evaluate>=0.4.0
      - sacrebleu>=2.3.0
      - unbabel-comet>=2.2.0
      - wandb>=0.16.0
      - peft>=0.18.0
      - accelerate>=0.25.0
      - pyyaml>=6.0
      - scikit-learn>=1.3.0
      - numpy>=1.24.0
      - tqdm>=4.66.0
      - python-dotenv>=1.0.0

      # Development tools (optional)
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - black>=23.0.0
      - ruff>=0.1.0
      - mypy>=1.7.0
      - pre-commit>=3.5.0
