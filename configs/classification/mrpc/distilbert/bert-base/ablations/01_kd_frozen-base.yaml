# 01_frozen_base-teacher_kl: Frozen pretrained teacher
# Teacher is frozen bert-base-uncased (not fine-tuned on MRPC)
# Tests whether pretrained knowledge alone helps distillation

inherit: ../base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: true
data:
  task: mrpc
  max_length: 128
  eval_split: validation

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.5              # Balance CE and KL loss
checkpointing:
  save_steps: 200
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 25

evaluation:
  eval_steps: 200
  eval_strategy: steps
