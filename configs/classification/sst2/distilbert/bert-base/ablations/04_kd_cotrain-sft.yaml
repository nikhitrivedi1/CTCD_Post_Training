# 04_cotrain_sft-teacher_kl: Co-training with fine-tuned teacher
# Both teacher and model train together
# Teacher starts from fine-tuned checkpoint and continues training

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: textattack/bert-base-uncased-SST-2
    freeze: false
data:
  task: sst2
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha_h: 0.5
  alpha_s: 0.5
checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
