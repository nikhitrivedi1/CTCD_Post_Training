# 04_cotrain_sft-teacher_kl: Co-training with fine-tuned teacher
# No public fine-tuned checkpoint for WNLI; uses pretrained bert-base-uncased
# Same as 03 but structurally consistent with other tasks

inherit: ../base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: false
data:
  task: wnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 20
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.5
checkpointing:
  save_steps: 40
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 10

evaluation:
  eval_steps: 40
  eval_strategy: steps
