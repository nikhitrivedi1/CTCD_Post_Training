# 04_cotrain_sft-teacher_kl: Co-training with SFT (task-trained) teacher, KL loss
# Teacher starts MNLI-trained, continues learning alongside model
# Tests: Does continued teacher training help when teacher already knows task?
# Expected: ~82-83% (may slightly improve or match frozen SFT)

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: textattack/bert-base-uncased-MNLI   # Pre-trained on MNLI
    freeze: false
data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha_h: 0.5 # CE + KL
  alpha_s: 0.5
  teacher_label_map: [1, 2, 0]

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
