# Sample: CTCD (co-training + co-distillation) on MNLI — DistilBERT student, BERT-base teacher
#
# How to run (from repo root):
#   python forge.py --config configs/classification/mnli/distilbert/bert-base/ablations/06_ctcd_sample.yaml
#
# Optional overrides:
#   python forge.py --config ... --run_name my_ctcd_run
#   python forge.py --config ... --teacher_adapter outputs/some_teacher_checkpoint
#
# Coefficients (once CTCD is wired in training code):
#   Student (alpha_s, alpha_h): L_student = alpha_h * CE(student) + alpha_s * KD(student vs detached teacher)
#   Teacher (beta_s, beta_h):  L_teacher = beta_h * CE(teacher) + beta_s * KD(teacher vs detached student)
#   Naming: _s = soft (distillation vs peer logits), _h = hard (cross-entropy on labels).
#
# Defaults (co-training teacher): if beta_h / beta_s are omitted, use beta_h = 1, beta_s = 0
#   (teacher CE-only — same as today). Co-distillation requires an explicit beta_s > 0.
#
# This file is a reference layout; ensure your Forge version supports these keys before experiments.

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: false

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  loss_type: response_kl
  temperature: 2.0
  alpha_s: 0.5
  alpha_h: 0.5
  beta_s: 0.5
  beta_h: 0.5

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
