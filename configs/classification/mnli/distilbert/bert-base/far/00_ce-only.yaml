# FAR 00: CE-only baseline (no distillation)
# R=0, F=0, A=0
# Purpose: Baseline to compare FAR combinations against

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: textattack/bert-base-uncased-MNLI   # SFT teacher
    freeze: false
data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 64                      # Reduced for memory (attention is expensive)
  gradient_accumulation_steps: 4      # Effective batch = 64×4 = 256
  learning_rate: 0.00032              # Linear scaling: 16x base (uses effective batch)
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha_h: 1.0 # CE-only (no distillation)
  alpha_s: 0.0
checkpointing:
  save_steps: 250
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 50

evaluation:
  eval_steps: 250
  eval_strategy: steps
