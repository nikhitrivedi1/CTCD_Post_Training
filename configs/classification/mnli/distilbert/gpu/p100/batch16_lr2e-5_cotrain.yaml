# BERT → DistilBERT on MNLI - Co-training (Teacher trains with model)
# Batch size: 16, LR: 2e-5
# Expected accuracy: ~82% (matching paper results)

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: false
data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002    # 2e-05
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha_h: 0.5
  alpha_s: 0.5
checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
