# BERT → DistilBERT on MNLI - Co-training on H200
# Batch size: 64 (4x base), LR: 8e-5 (linear scaling from 2e-5)
# Expected accuracy: ~82%

inherit: ../base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: false
data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 64            # 4x paper's batch size
  learning_rate: 0.00008    # 8e-5 (4x paper's 2e-5)
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha: 0.5
checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 50

evaluation:
  eval_steps: 500
  eval_strategy: steps
