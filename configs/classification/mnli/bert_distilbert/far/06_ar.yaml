# FAR 05: Response + Attention distillation
# R=1, F=0, A=1
# Combines soft label transfer with attention pattern matching

inherit: ../base.yaml

model:
  teacher: textattack/bert-base-uncased-MNLI  # SFT teacher
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 64                      # Reduced for memory (attention is expensive)
  gradient_accumulation_steps: 4      # Effective batch = 64×4 = 256
  learning_rate: 0.00032              # Linear scaling: 16x base (uses effective batch)
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha: 0.5
  freeze_teacher: false
  teacher_label_map: [1, 2, 0]  # TextAttack to HuggingFace label mapping
  loss_strategies:
    - type: response_kl
      weight: 1.0
    - type: attention_kl
      weight: 1.0
  layer_mapping:
    type: uniform

checkpointing:
  save_steps: 250
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 50

evaluation:
  eval_steps: 250
  eval_strategy: steps
