# 05_no_mapping_sft-teacher_kl: No logit reordering, apply mapping only during eval
# Test: Does the student learn correct associations from hard labels + raw soft targets?
# Expected: May work due to student's pretrained base + hard label supervision
# Compare to 04 (79% with [1,2,0] mapping) and see if simpler approach works

inherit: ../base.yaml

model:
  teacher: textattack/bert-base-uncased-MNLI  # Pre-trained on MNLI
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.5              # CE + KL
  freeze_teacher: false   # Co-training (SFT teacher continues learning)
  # No teacher_label_map: Use raw teacher logits, apply mapping only during evaluation
  # teacher_label_map: [1, 2, 0]  # Commented out

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps