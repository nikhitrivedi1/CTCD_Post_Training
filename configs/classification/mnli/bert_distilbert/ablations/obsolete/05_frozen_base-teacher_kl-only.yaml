# 05_frozen_base-teacher_kl-only: Pure KL distillation (no CE loss)
# Alpha = 1.0 means only KL divergence loss, no cross-entropy with labels
# Tests whether soft labels alone are sufficient for learning
# Expected: Slightly lower than α=0.5 (missing hard label signal)

inherit: ../base.yaml

model:
  teacher: bert-base-uncased
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 1.0              # KL only, no CE loss
  freeze_teacher: true    # Traditional distillation (frozen)

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
