# 03_cotrain_base-teacher_kl: Co-training with base (LM-pretrained) teacher, KL loss
# Teacher starts from LM-pretrained, learns MNLI during distillation
# Both models improve together - teacher's soft labels get better over time
# Expected: ~82% (matches paper results)

inherit: ../../../../base.yaml

model:
  teacher: bert-base-uncased  # LM-pretrained, learns MNLI during training
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.5              # CE + KL
  freeze_teacher: false   # Co-training (teacher learns too)

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
