# 03_cotrain_base-teacher_kl: Co-training with untrained teacher
# Teacher learns alongside model from scratch
# Tests if joint training provides mutual benefit

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: false
data:
  task: qqp
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha_h: 0.5 # Balanced CE + KL
  alpha_s: 0.5
checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
