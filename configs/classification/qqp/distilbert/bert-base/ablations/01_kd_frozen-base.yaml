# 01_frozen_base-teacher_kl: Frozen untrained teacher
# Tests if random soft labels provide useful regularization
# Teacher: bert-base-uncased (not fine-tuned on QQP, ~50% accuracy)

inherit: base.yaml

model:
  name: distilbert-base-uncased
  init: pretrained
  teacher:
    name: bert-base-uncased
    freeze: true
data:
  task: qqp
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha_h: 1.0
  alpha_s: 1.0
checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
