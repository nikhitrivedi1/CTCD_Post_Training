# BERT → DistilBERT on MNLI - Optimized for T4 (16 GB) / Colab Free
# Batch size: 128 (8× base) - conservative for 16GB memory
# Expected memory: ~10 GB (leaves ~6 GB headroom)
# Expected time: ~1 hour on T4

inherit: ../../../../base.yaml

model:
  teacher: bert-base-uncased
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 128          # 8× base (conservative for 16GB)
  learning_rate: 0.00016   # 8× base (linear scaling rule)
  warmup_steps: 400        # Increased for larger batch
  weight_decay: 0.01
  max_grad_norm: 2.0
  dataloader_num_workers: 2  # Colab has limited CPU
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha: 0.5

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 500  # Must match save_steps for load_best_model_at_end
  eval_strategy: steps
