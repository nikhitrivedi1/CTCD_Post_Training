# 02_frozen_sft-teacher_kl: Frozen SFT (task-trained) teacher with KL loss
# Teacher is pre-trained on MNLI, provides expert soft labels
# This is the "standard" KD setup from most papers
# Expected: ~81-82% (proper KD with trained teacher)

inherit: ../../../base.yaml

model:
  teacher: textattack/bert-base-uncased-MNLI  # Pre-trained on MNLI
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.5              # CE + KL
  freeze_teacher: true    # Traditional distillation (frozen)
  # TextAttack uses [contradiction, entailment, neutral] but dataset uses [entailment, neutral, contradiction]
  teacher_label_map: [1, 2, 0]

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
