# 00_no-teacher_ce-only: Baseline without teacher
# Student trains on MNLI with cross-entropy loss only
# No teacher supervision - establishes baseline for distillation comparison
# Expected: ~79-80% (DistilBERT baseline without teacher guidance)

inherit: ../../../base.yaml

model:
  teacher: bert-base-uncased  # Unused but required by trainer
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true

distillation:
  temperature: 2
  alpha: 0.0              # CE only, no KL loss
  freeze_teacher: true    # Teacher not used anyway

checkpointing:
  save_steps: 2000
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 2000
  eval_strategy: steps
