# RFA 04: Response + Feature distillation
# R=1, F=1, A=0
# Combines soft label transfer with hidden state matching

inherit: ../../../base.yaml

model:
  teacher: textattack/bert-base-uncased-MNLI  # SFT teacher
  student: distilbert-base-uncased
  student_init: pretrained

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 256           # A100/H200 optimized
  learning_rate: 0.00032    # Linear scaling: 16x base
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha: 0.5
  freeze_teacher: false
  teacher_label_map: [1, 2, 0]  # TextAttack to HuggingFace label mapping
  loss_strategies:
    - type: kl_divergence
      weight: 1.0
    - type: feature_mse
      weight: 1.0
  layer_mapping:
    type: uniform

checkpointing:
  save_steps: 250
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 50

evaluation:
  eval_steps: 250
  eval_strategy: steps
