# BERT → DistilBERT on MNLI - Quick version (~30-45 min on A100)
# For rapid iteration and testing on Google Colab
# Full version: default.yaml (3 epochs, ~2-3 hours)

inherit: default.yaml

training:
  num_epochs: 1          # 1 epoch instead of 3
  batch_size: 64         # Larger batch = fewer steps (A100 can handle this easily)

checkpointing:
  save_steps: 1000       # Less frequent saves
  save_total_limit: 2

evaluation:
  eval_steps: 1000       # Less frequent evals

logging:
  logging_steps: 100
