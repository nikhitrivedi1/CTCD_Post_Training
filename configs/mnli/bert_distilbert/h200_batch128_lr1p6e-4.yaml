# BERT → DistilBERT on MNLI - H200 Conservative Variant
# Batch size: 128 (8× base) - More stable training dynamics
# LR: 1.6e-4 (8× base, linear scaling)
# Use this for best training quality when speed isn't critical

inherit: ../../base.yaml

model:
  teacher: bert-base-uncased
  student: distilbert-base-uncased
  student_init: fresh

data:
  task: mnli
  max_length: 128

training:
  num_epochs: 3
  batch_size: 128
  learning_rate: 0.00016
  warmup_steps: 400
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

distillation:
  temperature: 2
  alpha: 0.5

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 500
  eval_strategy: steps
