# 04_cotrain_sft-teacher_kl: Co-training with SFT (instruction-tuned) teacher
# Teacher is Llama-3.2-3B-Instruct, continues learning during training
# Adaptive Domain-Expert - best setup from classification experiments
# Tests: Does "Strong Opinions, Loosely Held" transfer to translation?

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct  # Instruction-tuned, continues learning
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

data:
  task: translation
  dataset: europarl
  source_lang: en
  target_lang: fr
  max_samples: 45715
  max_length: 256

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 24  # Effective batch size 96
  learning_rate: 0.0001
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  use_lora: true
  lora:
    r: 16
    alpha: 16
    dropout: 0.05
    target_modules: ["down_proj", "up_proj", "gate_proj"]

distillation:
  temperature: 15.0       # High temp for 128k vocab
  alpha: 0.2              # Lower than classification since high T softens KL
  freeze_teacher: false   # Co-training - Adaptive Domain-Expert

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 10

evaluation:
  eval_steps: 500
  eval_strategy: steps
