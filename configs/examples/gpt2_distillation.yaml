# Example: GPT-2 Medium → GPT-2 Small
# Generic language modeling distillation

inherit: ../base.yaml

model:
  name: gpt2
  init: pretrained
  teacher:
    name: gpt2-medium       # 345M parameters
data:
  task: text_generation     # You'd need to implement this loader
  dataset: wikitext
  subset: wikitext-103-raw-v1
  max_length: 512

training:
  num_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4  # Effective batch size 32
  learning_rate: 5e-5
  warmup_steps: 500
  fp16: true

distillation:
  temperature: 2.0
  alpha: 0.7  # More emphasis on teacher knowledge

checkpointing:
  save_steps: 1000

logging:
  logging_steps: 50

evaluation:
  eval_steps: 1000
