# Example: Fine-tuned Domain Expert → Smaller Model
# Demonstrates distilling domain-specific knowledge

inherit: base.yaml

model:
  # Use your own fine-tuned models
  name: distilbert-base-uncased
  init: fresh
  teacher:
    name: your-org/finetuned-bert-medical     # Your domain expert
data:
  task: medical_classification                 # Custom task
  dataset: your_medical_dataset
  max_length: 256
  num_labels: 10                               # Task-specific

training:
  num_epochs: 5
  batch_size: 16
  learning_rate: 2e-5
  warmup_steps: 300

distillation:
  temperature: 4.0    # Higher for complex domain knowledge
  alpha_h: 0.2 # Heavy emphasis on teacher
  alpha_s: 0.8

checkpointing:
  save_steps: 200

logging:
  report_to: wandb
  logging_steps: 50

evaluation:
  eval_steps: 500
