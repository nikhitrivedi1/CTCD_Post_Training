# Llama 3.2 3B → 1B Translation - Quick version (~45-60 min on A100)
# For rapid iteration and testing on Google Colab
# Full version: llama_3b_1b_translation.yaml (3 epochs, ~6-8 hours)

inherit: llama_3b_1b_translation.yaml

data:
  max_samples: 10000     # 10K samples instead of 45K

training:
  num_epochs: 1          # 1 epoch instead of 3
  gradient_accumulation_steps: 8  # Faster updates (effective batch 32 instead of 96)

checkpointing:
  save_steps: 200
  save_total_limit: 2

evaluation:
  eval_steps: 200

logging:
  logging_steps: 20
