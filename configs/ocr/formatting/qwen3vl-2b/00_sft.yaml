# Formatting SFT: teach the model to produce inline formatting
# Loads the olmocr-mix SFT adapter, then fine-tunes on formatting data
#
# Pipeline: Qwen3-VL-2B -> SFT (olmocr-mix) -> SFT (formatting) -> GRPO (formatting)
#
# Run:
#   ADAPTER=outputs/olmocr-mix_ablations_00_no-teacher_ce-only_20260225-0952Z \
#     sbatch scripts/slurm/run_training.sh formatting_sft configs/ocr/formatting/qwen3vl-2b/00_sft.yaml

inherit: base.yaml

training:
  warmup_steps: 50

distillation:
  alpha: 0.0              # CE only

checkpointing:
  save_steps: 100

logging:
  logging_steps: 10

evaluation:
  eval_strategy: steps
  eval_steps: 100
