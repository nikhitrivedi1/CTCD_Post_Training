# Formatting SFT: stronger formatting prior
# Higher LR + more epochs to give the model a deeper formatting habit
#
# Run:
#   ADAPTER=outputs/ocr_sft \
#     sbatch scripts/slurm/run_training.sh fmt_sft configs/ocr/formatting/qwen3vl-2b/00_sft.yaml

inherit: base.yaml

training:
  num_epochs: 5
  learning_rate: 5e-6
  warmup_steps: 50

distillation:
  alpha: 0.0              # CE only

checkpointing:
  save_steps: 100

logging:
  logging_steps: 10

evaluation:
  eval_strategy: steps
  eval_steps: 100
