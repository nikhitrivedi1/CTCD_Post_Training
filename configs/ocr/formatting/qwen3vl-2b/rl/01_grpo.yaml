# Formatting GRPO v2: Qwen3-VL-2B
# Per-type F1 reward, KL regularization. Fixes from v1 regression.
#
# Run:
#   ADAPTER=outputs/fmt_sft \
#     sbatch scripts/slurm/run_training.sh fmt_grpo_v2 configs/ocr/formatting/qwen3vl-2b/rl/01_grpo.yaml

inherit: base.yaml

rl:
  reward:
    edit_similarity: 0.25
    inline_formatting_pertype: 1.0
  generation_batch_size: 16
  temperature: 1.0
  beta: 0.1
