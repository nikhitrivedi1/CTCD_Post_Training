# Formatting GRPO: upweighted formatting reward + higher temperature
# Formatting reward gets 3x weight so it dominates the advantage signal.
# Temperature 1.3 forces more diversity in formatting behavior across generations.
#
# Run:
#   ADAPTER=outputs/fmt_sft \
#     sbatch scripts/slurm/run_training.sh fmt_grpo configs/ocr/formatting/qwen3vl-2b/rl/00_grpo.yaml

inherit: base.yaml

rl:
  algorithm: grpo
  reward: [edit_similarity, inline_formatting]
  reward_weights: [1.0, 3.0]
  num_generations: 4
  generation_batch_size: 4
  max_completion_length: 1024
  temperature: 1.3
  beta: 0.0
  loss_type: grpo
  log_completions: true
