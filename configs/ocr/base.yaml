# OCR task base configuration
# Shared settings for all OCR experiments

inherit: ../base.yaml

data:
  max_visual_tokens: 2048          # Cap visual tokens per image, fits GRPO on H200

training:
  fp16: false  # VLMs use bfloat16 natively

evaluation:
  compute_ocr_metrics: true
  max_new_tokens: 2048
