# OCR task base configuration
# Shared settings for all OCR experiments

inherit: ../base.yaml

data:
  task: ocr
  max_length: 1024
  max_visual_tokens: 2048          # Cap visual tokens per image, fits GRPO on H200

training:
  fp16: false  # VLMs use bfloat16 natively
  num_epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 1e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  warmup_steps: 50
  use_lora: true

  lora:
    r: 16
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

checkpointing:
  save_steps: 50
  save_total_limit: 3

logging:
  logging_steps: 10
  report_to: wandb

evaluation:
  eval_strategy: steps
  eval_steps: 50
  compute_ocr_metrics: true
  max_new_tokens: 2048
