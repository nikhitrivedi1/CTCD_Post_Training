# GRPO with unit test rewards on olmOCR-synthmix
# Starts from SFT checkpoint via --adapter, trains fresh LoRA with RL
#
# Pipeline: Qwen3-VL-2B -> SFT (5K olmOCR-mix) -> GRPO (synthmix unit tests)
#
# Run:
#   ADAPTER=outputs/<sft_checkpoint> \
#     sbatch scripts/slurm/run_training.sh configs/ocr/synthmix/qwen3vl-2b/rl/00_grpo.yaml

inherit: base.yaml

rl:
  algorithm: grpo
  reward: [unit_test]
  num_generations: 4
  max_completion_length: 1024
  temperature: 0.8
  beta: 0.0
  loss_type: grpo
  log_completions: true
