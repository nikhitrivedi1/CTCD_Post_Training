# BERT → DistilBERT on QQP task
# Target: 0.900 accuracy (from "Less is More" paper)

inherit: base.yaml

model:
  teacher: bert-base-uncased
  student: distilbert-base-uncased
  student_init: fresh  # Start from random initialization

data:
  task: qqp
  max_length: 128

training:
  num_epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0

distillation:
  temperature: 11  # Paper found 11 works best for QQP
  alpha: 0.5

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 100

evaluation:
  eval_steps: 1000
  eval_strategy: steps
