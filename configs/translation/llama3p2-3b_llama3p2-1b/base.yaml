# Llama 3.2 3B → 1B on English-French translation
# Target: BLEU ~27, COMET ~0.82 (from "Less is More" paper)

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained  # Use pretrained weights (matches MNLI setup)

data:
  task: translation
  dataset: europarl
  source_lang: en
  target_lang: fr
  max_samples: 45715  # Match paper
  max_length: 256

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 24  # Effective batch size 96
  learning_rate: 0.0001
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  use_lora: true
  lora:
    r: 16
    alpha: 16
    dropout: 0.05
    target_modules: [ "down_proj", "up_proj", "gate_proj" ]

distillation:
  temperature: 15.0  # High temp for 128k vocab (Hinton: T=20 for MNIST, higher for larger output spaces)
  alpha: 0.2  # Lower than classification (0.5) since high T already softens KL

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 10

evaluation:
  eval_steps: 500
  eval_strategy: steps
