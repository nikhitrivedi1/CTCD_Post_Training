# Staged Distillation 01: Feature → Response
# Tests hypothesis that F early + R late avoids gradient conflict
# Motivated by: DistilBERT uses F during pre-training, R-only wins in fine-tuning

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

training:
  num_epochs: 6  # 3 per stage (F: 3, R: 3)

distillation:
  # temperature and alpha inherited from base.yaml
  freeze_teacher: false

  # Staged distillation: F then R
  stages:
    - strategy: feature_cosine
      until_progress: 0.5           # First half: structural knowledge
    - strategy: response_kl
      until_progress: 1.0           # Second half: task decisions

  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear

logging:
  wandb_tags: ["translation", "staged", "f-r", "feature", "response"]
