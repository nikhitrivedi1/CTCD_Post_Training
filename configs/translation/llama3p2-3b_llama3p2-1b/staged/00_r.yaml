# Staged Baseline: R-only throughout (for comparison)
# Equivalent to RFA 01_r-only but in staged config format

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

distillation:
  # temperature and alpha inherited from base.yaml
  freeze_teacher: false

  # Single stage: R throughout (baseline for staged comparison)
  stages:
    - strategy: response_kl
      until_progress: 1.0

logging:
  wandb_tags: ["translation", "staged", "baseline", "response"]
