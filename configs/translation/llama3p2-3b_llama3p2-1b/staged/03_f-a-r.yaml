# Staged Distillation 03: Feature → Attention → Response
# Full F→A→R progression: structure → reasoning → decisions

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

training:
  num_epochs: 9  # 3 per stage (F: 3, A: 3, R: 3)

distillation:
  # temperature and alpha inherited from base.yaml
  freeze_teacher: false

  # Three-stage progression
  stages:
    - strategy: feature_cosine
      until_progress: 0.33          # Epochs 1-3: structural knowledge
    - strategy: attention_kl
      until_progress: 0.67          # Epochs 4-6: reasoning patterns
    - strategy: response_kl
      until_progress: 1.0           # Epochs 7-9: task decisions

  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear
  attention_mapping:
    type: average

logging:
  wandb_tags: ["translation", "staged", "f-a-r", "feature", "attention", "response"]
