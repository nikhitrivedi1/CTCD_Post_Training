# 02_frozen_sft-teacher_kl: Frozen SFT (instruction-tuned) teacher with KL loss
# Teacher is Llama-3.2-3B-Instruct (instruction-tuned)
# This is the "standard" KD setup - Stubborn Domain-Expert
# Tests: Does a frozen expert teacher help or hurt?

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct  # Instruction-tuned
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

data:
  task: europarl
  dataset: europarl
  source_lang: en
  target_lang: fr
  max_samples: 45715
  max_length: 256

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 24  # Effective batch size 96
  learning_rate: 0.0001
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  use_lora: true
  lora:
    r: 16
    alpha: 16
    dropout: 0.05
    target_modules: ["down_proj", "up_proj", "gate_proj"]

distillation:
  temperature: 15.0       # High temp for 128k vocab
  alpha: 0.2              # Lower than classification since high T softens KL
  freeze_teacher: true    # Traditional distillation (frozen) - Stubborn

checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 10

evaluation:
  eval_steps: 500
  eval_strategy: steps
