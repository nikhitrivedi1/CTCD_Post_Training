# FAR 07: Feature + Attention + Response (all three)
# R=1, F=1, A=1
# Full multi-level distillation
# Note: May suffer from gradient conflict (observed in MNLI)

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

distillation:
  # temperature and alpha inherited from base.yaml
  freeze_teacher: false   # Adaptive Domain-Expert
  loss_strategies:
    - type: response_kl
      weight: 1.0
    - type: feature_cosine
      weight: 1.0
    - type: attention_kl
      weight: 1.0
  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear
  attention_mapping:
    type: average

logging:
  wandb_tags: ["translation", "far", "far-all", "response", "feature", "attention"]
