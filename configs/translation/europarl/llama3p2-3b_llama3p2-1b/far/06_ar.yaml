# FAR 05: Response + Attention distillation
# R=1, F=0, A=1
# Combines soft label transfer with attention pattern matching

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

distillation:
  # temperature and alpha inherited from base.yaml
  freeze_teacher: false   # Adaptive Domain-Expert
  loss_strategies:
    - type: response_kl
      weight: 1.0
    - type: attention_kl
      weight: 1.0
  layer_mapping:
    type: uniform
  attention_mapping:
    type: average

logging:
  wandb_tags: ["translation", "far", "ra", "response", "attention"]
