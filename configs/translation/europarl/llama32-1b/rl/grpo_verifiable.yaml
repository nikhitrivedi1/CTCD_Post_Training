# GRPO with verifiable reward (BLEU) for EN-FR translation
# Student generates translations, scored by sentence-level BLEU against reference

inherit: ../base.yaml

data:
  task: europarl
  dataset: europarl
  source_lang: en
  target_lang: fr
  max_samples: 45715
  max_length: 256

rl:
  algorithm: grpo
  reward: verifiable
  num_generations: 4
  max_completion_length: 256
  temperature: 0.8
  beta: 0.0                  # No KL penalty (standard for GRPO)
  loss_type: grpo
  learning_rate: 1e-6        # Lower LR for RL stability
  log_completions: true
