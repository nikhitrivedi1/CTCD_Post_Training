# FAR 00: CE-only baseline (no distillation)
# R=0, F=0, A=0
# Student learns from ground truth only - establishes baseline

inherit: base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: true
distillation:
  # temperature inherited from base.yaml (unused when α=0)
  alpha: 0.0              # CE only: no distillation
  loss_type: none

logging:
  wandb_tags: ["translation", "far", "baseline", "ce-only"]
