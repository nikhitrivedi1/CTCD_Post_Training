# FAR 02: Feature distillation only (hidden state MSE)
# R=0, F=1, A=0
# Transfer intermediate representations
# Note: Requires projection due to dim mismatch (3072 → 2048)

inherit: base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
distillation:
  # temperature and alpha inherited from base.yaml
  loss_type: feature_cosine
  layer_mapping:
    type: uniform         # Maps 28 teacher layers → 16 model layers
  projection:
    enabled: true         # Project 3072 → 2048
    type: linear

logging:
  wandb_tags: ["translation", "far", "f-only", "feature"]
