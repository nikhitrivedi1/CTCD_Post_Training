# FAR 04: Response + Feature distillation
# R=1, F=1, A=0
# Combines soft label transfer with hidden state matching

inherit: ../base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
distillation:
  # temperature and alpha inherited from base.yaml
  loss_strategies:
  - type: response_kl
    weight: 1.0
  - type: feature_cosine
    weight: 1.0
  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear

logging:
  wandb_tags: ["translation", "far", "rf", "response", "feature"]
