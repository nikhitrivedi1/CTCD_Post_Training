# FAR 06: Feature + Attention distillation
# R=0, F=1, A=1
# Combines hidden state and attention pattern matching (no response)

inherit: ../base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
distillation:
  # temperature and alpha inherited from base.yaml
  loss_strategies:
  - type: feature_cosine
    weight: 1.0
  - type: attention_kl
    weight: 1.0
  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear
  attention_mapping:
    type: average

logging:
  wandb_tags: ["translation", "far", "fa", "feature", "attention"]
