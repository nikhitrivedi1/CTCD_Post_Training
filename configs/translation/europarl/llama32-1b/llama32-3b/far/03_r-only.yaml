# FAR 01: Response distillation only (KL divergence)
# R=1, F=0, A=0
# Classic knowledge distillation via soft labels
# Uses Adaptive Domain-Expert (best from L0)

inherit: base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
distillation:
  # temperature and alpha inherited from base.yaml
  loss_type: response_kl

logging:
  wandb_tags: ["translation", "far", "r-only", "response"]
