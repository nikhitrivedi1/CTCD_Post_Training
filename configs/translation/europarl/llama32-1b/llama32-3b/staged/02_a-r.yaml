# Staged Distillation 02: Attention → Response
# Tests if attention patterns first, then response matching improves results

inherit: ../base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
training:
  num_epochs: 6  # 3 per stage (A: 3, R: 3)

distillation:
  # temperature and alpha inherited from base.yaml
  stages:
  - strategy: attention_kl
    until_progress: 0.5             # First half: attention patterns
  - strategy: response_kl
    until_progress: 1.0             # Second half: task decisions

  layer_mapping:
    type: uniform
  attention_mapping:
    type: average

logging:
  wandb_tags: ["translation", "staged", "a-r", "attention", "response"]
