# Staged Baseline: R-only throughout (for comparison)
# Equivalent to FAR 01_r-only but in staged config format

inherit: base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B-Instruct
    freeze: false
distillation:
  # temperature and alpha inherited from base.yaml
  stages:
  - strategy: response_kl
    until_progress: 1.0

logging:
  wandb_tags: ["translation", "staged", "baseline", "response"]
