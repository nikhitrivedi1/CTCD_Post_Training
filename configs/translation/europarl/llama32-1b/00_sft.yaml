# 00_no-teacher_ce-only: Baseline without teacher
# Student trains on EN-FR translation with cross-entropy loss only
# No teacher supervision - establishes baseline for distillation comparison

inherit: base.yaml

model:
  name: meta-llama/Llama-3.2-1B-Instruct
  init: pretrained
  teacher:
    name: meta-llama/Llama-3.2-3B   # Not loaded (alpha=0.0), kept for config consistency
    freeze: true
data:
  task: europarl
  dataset: europarl
  source_lang: en
  target_lang: fr
  max_samples: 45715
  max_length: 256

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 24  # Effective batch size 96
  learning_rate: 0.0001
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 2.0
  fp16: true
  use_lora: true
  lora:
    r: 16
    alpha: 16
    dropout: 0.05
    target_modules: ["down_proj", "up_proj", "gate_proj"]

distillation:
  # temperature irrelevant when α=0
  alpha_h: 1.0 # CE only: no distillation
  alpha_s: 0.0
checkpointing:
  save_steps: 500
  save_total_limit: 3

logging:
  report_to: wandb
  logging_steps: 10

evaluation:
  eval_steps: 500
  eval_strategy: steps
