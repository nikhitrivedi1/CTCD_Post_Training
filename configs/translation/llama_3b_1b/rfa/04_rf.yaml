# RFA 04: Response + Feature distillation
# R=1, F=1, A=0
# Combines soft label transfer with hidden state matching

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

distillation:
  temperature: 2.0
  alpha: 0.5
  freeze_teacher: false   # Adaptive Domain-Expert
  loss_strategies:
    - type: kl_divergence
      weight: 1.0
    - type: feature_mse
      weight: 1.0
  layer_mapping:
    type: uniform
  projection:
    enabled: true
    type: linear

logging:
  wandb_tags: ["translation", "rfa", "rf", "response", "feature"]
