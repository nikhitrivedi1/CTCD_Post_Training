# RFA 03: Attention distillation only (attention KL)
# R=0, F=0, A=1
# Transfer attention patterns
# Note: Head count differs (24 → 8), uses head averaging

inherit: ../base.yaml

model:
  teacher: meta-llama/Llama-3.2-3B-Instruct
  student: meta-llama/Llama-3.2-1B-Instruct
  student_init: pretrained

distillation:
  temperature: 2.0
  alpha: 0.5
  freeze_teacher: false   # Adaptive Domain-Expert
  loss_type: attention_kl
  layer_mapping:
    type: uniform         # Maps 28 teacher layers → 16 student layers
  attention_mapping:
    type: average         # Average 24 heads → 8 heads (groups of 3)

logging:
  wandb_tags: ["translation", "rfa", "a-only", "attention"]
